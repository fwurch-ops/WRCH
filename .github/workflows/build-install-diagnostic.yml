name: Build WRCH Install Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [ install-diagnostic ]
    paths:
      - 'diagnostic/**'
      - 'settings.gradle.kts'
      - '.github/workflows/build-install-diagnostic.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build diagnostic APK
        run: gradle :diagnostic:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WRCH-install-diagnostic
          path: diagnostic/build/outputs/apk/debug/diagnostic-debug.apk
