name: Deploy WRCH Web

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/src/main/assets/index_*.txt'
      - 'web/**'
      - '.github/workflows/deploy-web.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static WRCH site
        shell: bash
        run: |
          mkdir -p _site
          cat app/src/main/assets/index_*.txt | base64 --decode | gzip --decompress > _site/index.html
          cp web/manifest.webmanifest _site/manifest.webmanifest
          cp web/sw.js _site/sw.js
          cp web/icon.svg _site/icon.svg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
